services:
  jetmon-bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command:
      - -dsn
      - "${JETMON_DSN:-}"
      - -addr
      - "0.0.0.0:7400"
      - "-write=${JETMON_WRITE:-false}"
      - -write-dsn
      - "${JETMON_WRITE_DSN:-}"
      - -token
      - "${JETMON_TOKEN:-}"
      - "-bucket=${JETMON_BUCKET:-0}"
      - -history-path
      - "${JETMON_HISTORY_PATH:-}"
      - -history-poll-interval
      - "${JETMON_HISTORY_POLL_INTERVAL:-15s}"
      - "-history-bootstrap=${JETMON_HISTORY_BOOTSTRAP:-true}"
    ports:
      - "${BRIDGE_LOCAL_PORT:-7400}:7400"
    networks:
      - default
      - jetmon-shared

networks:
  jetmon-shared:
    external: true
