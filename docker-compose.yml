services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jetmon_test}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jetmon_db}
    ports:
      - "${MYSQL_LOCAL_PORT:-3307}:3306"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  jetmon-bridge:
    build: .
    command:
      - -dsn
      - "root:${MYSQL_ROOT_PASSWORD:-jetmon_test}@tcp(mysql:3306)/${MYSQL_DATABASE:-jetmon_db}"
      - -addr
      - "0.0.0.0:7400"
    ports:
      - "${BRIDGE_LOCAL_PORT:-7400}:7400"
    depends_on:
      mysql:
        condition: service_healthy
